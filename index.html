<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Miner App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- كود إعلانات Adexium بمعرّف التنسيب الكامل -->
    <script src="https://adexium.io/sdk.js" data-wid="bf93723c-311b-4879-a88e-ee06a37904f2"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .balance-title {
            color: #ffcc00;
            font-size: 16px;
            margin-bottom: 5px;
        }
        .balance-coins {
            color: #00ffcc;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .balance-usd {
            color: #aaaaaa;
            font-size: 14px;
        }
        .btn {
            background-color: #00ffcc;
            color: #121212;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-secondary {
            background-color: #2e2e2e;
            color: #ffffff;
            border: 1px solid #444;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #2e2e2e;
            color: #ffffff;
            font-size: 14px;
            box-sizing: border-box;
            margin-top: 8px;
            margin-bottom: 12px;
        }
        .status-msg {
            font-size: 13px;
            color: #00ffcc;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- قسم الرصيد الحالي -->
        <div class="card">
            <div class="balance-title">رصيدك الحالي</div>
            <div class="balance-coins" id="coinsDisplay">0 عملة</div>
            <div class="balance-usd" id="usdDisplay">$0.00</div>
        </div>

        <!-- زر مشاهدة الإعلان -->
        <div class="card">
            <button class="btn" onclick="watchAd()">📺 مشاهدة إعلان وكسب 400 عملة</button>
            <div class="status-msg">✅ البوت جاهز للعمل وكسب الأرباح بنجاح.</div>
        </div>

        <!-- زر التحويل إلى دولار -->
        <div class="card" style="padding: 15px;">
            <button class="btn btn-secondary" onclick="convertToUsd()">تحويل إلى دولار ($)</button>
        </div>

        <!-- قسم سحب الأرباح -->
        <div class="card">
            <div class="balance-title" style="text-align: right;">💳 سحب الأرباح</div>
            <select id="withdrawMethod">
                <option value="Binance ID">منصة باينانس (Binance ID)</option>
                <option value="Payeer">باير (Payeer)</option>
            </select>
            <input type="text" id="accountInput" placeholder="أدخل معرف الحساب الخاص بك">
            <button class="btn" onclick="requestWithdrawal()">طلب السحب</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // البدء من الصفر تماماً
        let coins = parseInt(localStorage.getItem('bot_coins')) || 0;
        let usd = parseFloat(localStorage.getItem('bot_usd')) || 0.00;

        updateUI();

        function updateUI() {
            document.getElementById('coinsDisplay').innerText = coins + ' عملة';
            document.getElementById('usdDisplay').innerText = '$' + usd.toFixed(2);
            localStorage.setItem('bot_coins', coins);
            localStorage.setItem('bot_usd', usd.toFixed(2));
        }

        function watchAd() {
            // استدعاء دالة الإعلان الخاصة بالمنصة إن توفرت
            if (typeof showAdexiumAd === 'function') {
                showAdexiumAd();
            } else if (window.Adexium && typeof window.Adexium.show === 'function') {
                window.Adexium.show();
            }

            // إضافة 400 عملة للمستخدم وتحديث الواجهة
            coins += 400;
            updateUI();
        }

        function convertToUsd() {
            if (coins < 3200) {
                alert('عذراً، يجب أن تمتلك 3200 عملة على الأقل للتحويل!');
                return;
            }
            
            // كل 3200 عملة تساوي 0.02 دولار
            let units = Math.floor(coins / 3200);
            let earnedUsd = units * 0.02;
            let deductedCoins = units * 3200;

            coins -= deductedCoins;
            usd += earnedUsd;
            
            updateUI();
            alert('تم تحويل ' + deductedCoins + ' عملة بنجاح إلى ' + earnedUsd.toFixed(2) + '$');
        }

        function requestWithdrawal() {
            let method = document.getElementById('withdrawMethod').value;
            let account = document.getElementById('accountInput').value.trim();

            if (!account) {
                alert('الرجاء إدخال معرف الحساب الخاص بك بشكل صحيح!');
                return;
            }

            if (usd <= 0) {
                alert('رصيدك الحالي من الدولار هو 0، لا يمكنك السحب حالياً!');
                return;
            }

            let requestedAmount = usd;

            // خصم الرصيد فوراً عند طلب السحب
            usd = 0;
            updateUI();

            // إرسال تفاصيل السحب للبوت عبر التيليجرام
            let withdrawalData = {
                action: "withdrawal",
                method: method,
                account: account,
                amount: requestedAmount.toFixed(2)
            };

            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                withdrawalData.user_id = tg.initDataUnsafe.user.id;
                withdrawalData.username = tg.initDataUnsafe.user.username;
            }

            try {
                tg.sendData(JSON.stringify(withdrawalData));
            } catch (e) {
                console.log("Data sent fallback");
            }

            alert('تم تقديم طلب السحب بقيمة $' + requestedAmount.toFixed(2) + ' بنجاح وتم خصم المبلغ من رصيدك!');
            document.getElementById('accountInput').value = '';
        }
    </script>
</body>
</html>
