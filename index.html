<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Coin Miner App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sad.adsgram.ai/js/adsgram.min.js" onload="onAdsLoaded()" onerror="onAdsError()"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 15px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 400px; }
        .card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: center;
        }
        h3 { margin: 0 0 10px 0; color: #ffcc00; font-size: 18px; }
        .balance-num { font-size: 24px; color: #00ffcc; font-weight: bold; }
        .dollar-num { font-size: 14px; color: #888; margin-top: 5px; }
        button {
            background-color: #444;
            color: #aaa;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: not-allowed;
            width: 100%;
            margin-top: 10px;
            transition: 0.3s;
        }
        button.active {
            background-color: #00ffcc;
            color: #121212;
            cursor: pointer;
        }
        .btn-secondary { background-color: #2c2c2c; color: #ffffff; border: 1px solid #444; cursor: pointer; }
        select, input {
            width: 100%;
            padding: 10px;
            background: #2c2c2c;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            margin-top: 8px;
            box-sizing: border-box;
        }
        #status { margin-top: 10px; font-size: 13px; color: #ffcc00; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h3>رصيدك الحالي</h3>
            <div class="balance-num"><span id="balance">0</span> عملة 🪙</div>
            <div class="dollar-num">$<span id="dollar">0.00</span></div>
        </div>

        <div class="card">
            <button id="adBtn" onclick="showRewardedAd()">جاري تحميل شبكة الإعلانات...</button>
            <div id="status">يرجى الانتظار لحظات حتى يجهز النظام...</div>
        </div>

        <div class="card">
            <button class="btn-secondary" onclick="convertToDollar()">تحويل إلى دولار ($)</button>
        </div>

        <div class="card">
            <h3>💳 سحب الأرباح</h3>
            <select><option>منصة باينانس (Binance ID)</option></select>
            <input type="text" placeholder="أدخل معرف باينانس الخاص بك">
            <button class="btn-secondary" style="margin-top: 12px;" onclick="alert('قريباً سيتم تفعيل السحب')">طلب السحب</button>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        let userBalance = localStorage.getItem('user_balance') ? parseInt(localStorage.getItem('user_balance')) : 0;
        updateUI();

        function updateUI() {
            document.getElementById('balance').innerText = userBalance;
            let dollars = (userBalance / 4000).toFixed(2);
            document.getElementById('dollar').innerText = dollars;
        }

        let systemState = false;

        function onAdsLoaded() {
            systemState = 'ads';
            const btn = document.getElementById('adBtn');
            btn.innerText = "مشاهدة إعلان وكسب 400 عملة 📺";
            btn.classList.add('active');
            document.getElementById('status').innerText = "✅ النظام والشبكة الإعلانية جاهزان!";
        }

        function onAdsError() {
            systemState = 'fallback';
            const btn = document.getElementById('adBtn');
            btn.innerText = "مشاهدة إعلان وكسب 400 عملة 📺";
            btn.classList.add('active');
            document.getElementById('status').innerText = "✅ البوت جاهز للعمل وكسب الأرباح بنجاح.";
        }

        // احتياطي في حال تأخر الحدث
        setTimeout(() => {
            if (!systemState) {
                onAdsError();
            }
        }, 2000);

        function showRewardedAd() {
            const statusDiv = document.getElementById('status');
            
            let adLogs = JSON.parse(localStorage.getItem('ad_logs') || '[]');
            const now = Date.now();
            adLogs = adLogs.filter(time => now - time < 3600000);
            localStorage.setItem('ad_logs', JSON.stringify(adLogs));

            if (adLogs.length >= 10) {
                statusDiv.innerText = "⚠️ لقد وصلت للحد الأقصى (10 محاولات في الساعة).";
                return;
            }

            if (!systemState) {
                statusDiv.innerText = "⏳ يرجى الانتظار قليلاً جاري التحميل...";
                return;
            }

            if (systemState === 'fallback') {
                userBalance += 400;
                localStorage.setItem('user_balance', userBalance);
                updateUI();
                adLogs.push(Date.now());
                localStorage.setItem('ad_logs', JSON.stringify(adLogs));
                statusDiv.innerText = "🎉 مبروك! تمت إضافة 400 عملة لرصيدك بنجاح.";
                return;
            }

            statusDiv.innerText = "جاري فتح الإعلان...";
            try {
                const adController = window.Adsgram.init({ blockId: "41505" });
                adController.show()
                    .then(() => {
                        adLogs.push(Date.now());
                        localStorage.setItem('ad_logs', JSON.stringify(adLogs));

                        userBalance += 400;
                        localStorage.setItem('user_balance', userBalance);
                        updateUI();
                        statusDiv.innerText = "🎉 مبروك! تمت إضافة 400 عملة لرصيدك.";
                    })
                    .catch((err) => {
                        // تفعيل احتياطي فوري إذا اغلق المستخدم الإعلان أو حدث خطأ لضمان عدم توقف التطبيق
                        userBalance += 400;
                        localStorage.setItem('user_balance', userBalance);
                        updateUI();
                        statusDiv.innerText = "🎉 تم منح الـ 400 عملة بنجاح.";
                    });
            } catch (e) {
                userBalance += 400;
                localStorage.setItem('user_balance', userBalance);
                updateUI();
                statusDiv.innerText = "🎉 تمت إضافة 400 عملة بنجاح.";
            }
        }

        function convertToDollar() {
            alert("تم تحديث حساب الأرباح بنجاح!");
        }
    </script>
</body>
</html>
