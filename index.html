<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Miner & Task Bot</title>
    <!-- استدعاء مكتبة الإعلانات الرسمية -->
    <script src="https://sad.adsgram.ai/js/adsgram.min.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #00ffcc;
        }
        .balance-box {
            font-size: 20px;
            margin: 20px 0;
            background: #2c2c2c;
            padding: 12px;
            border-radius: 8px;
        }
        button {
            background-color: #00ffcc;
            color: #121212;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: 0.3s;
        }
        button:active {
            transform: scale(0.98);
        }
        button:hover {
            background-color: #00b386;
            color: #ffffff;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #ffcc00;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Task & Coin Miner</h1>
        <p>شاهد الإعلانات واحصل على عملات رقمية مجانية!</p>
        
        <div class="balance-box">
            رصيدك: <span id="balance">0</span> عملة 🪙
        </div>

        <!-- زر مشاهدة الإعلان -->
        <button onclick="showRewardedAd()">مشاهدة إعلان وكسب 10 عملات 📺</button>
        
        <div id="status"></div>
    </div>

    <script>
        // المتغيرات الأساسية
        let userBalance = localStorage.getItem('user_balance') ? parseInt(localStorage.getItem('user_balance')) : 0;
        document.getElementById('balance').innerText = userBalance;

        // تهيئة إعلانات Adsgram بالـ Block ID الصحيح
        const adController = window.Adsgram.init({ blockId: "41505" });

        // دالة عرض الإعلان عند الضغط على الزر
        function showRewardedAd() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "جاري تحميل الإعلان...";

            adController.show()
                .then((result) => {
                    // نجاح مشاهدة الإعلان بالكامل
                    userBalance += 10;
                    localStorage.setItem('user_balance', userBalance);
                    document.getElementById('balance').innerText = userBalance;
                    statusDiv.innerText = "🎉 مبروك! تمت إضافة 10 عملات لرصيدك.";
                    console.log("Ad watched successfully", result);
                })
                .catch((err) => {
                    // إلغاء الإعلان أو خطأ في التحميل
                    statusDiv.innerText = "⚠️ لم تقم بمشاهدة الإعلان كاملًا.";
                    console.log("Ad was closed or failed", err);
                });
        }
    </script>
</body>
</html>
