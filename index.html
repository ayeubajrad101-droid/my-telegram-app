<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Coin Miner App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- كود إعلانات Adsterra Social Bar الخاص بك -->
    <script type='text/javascript' src='//pl30621564.highcpmrate.com/30/62/15/30621564.js'></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            padding: 15px;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 400px; }
        .card {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: center;
        }
        h3 { margin: 0 0 10px 0; color: #ffcc00; font-size: 18px; }
        .balance-num { font-size: 24px; color: #00ffcc; font-weight: bold; }
        .dollar-num { font-size: 14px; color: #888; margin-top: 5px; }
        button {
            background-color: #00ffcc;
            color: #121212;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        .btn-secondary { background-color: #2c2c2c; color: #ffffff; border: 1px solid #444; }
        select, input {
            width: 100%;
            padding: 10px;
            background: #2c2c2c;
            color: #fff;
            border: 1px solid #444;
            border-radius: 8px;
            margin-top: 8px;
            box-sizing: border-box;
        }
        #status { margin-top: 10px; font-size: 13px; color: #00ffcc; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h3>رصيدك الحالي</h3>
            <div class="balance-num"><span id="balance">0</span> عملة 🪙</div>
            <div class="dollar-num">$<span id="dollar">0.00</span></div>
        </div>

        <div class="card">
            <button onclick="watchAd()">مشاهدة إعلان وكسب 400 عملة 📺</button>
            <div id="status">النظام متصل وجاهز للربح</div>
        </div>

        <div class="card">
            <button class="btn-secondary" onclick="convertToDollar()">تحويل إلى دولار ($)</button>
        </div>

        <div class="card">
            <h3>💳 سحب الأرباح</h3>
            <select><option>منصة باينانس (Binance ID)</option></select>
            <input type="text" placeholder="أدخل معرف باينانس الخاص بك">
            <button class="btn-secondary" style="margin-top: 12px;" onclick="alert('قريباً سيتم تفعيل السحب')">طلب السحب</button>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        let userBalance = localStorage.getItem('user_balance') ? parseInt(localStorage.getItem('user_balance')) : 0;
        updateUI();

        function updateUI() {
            document.getElementById('balance').innerText = userBalance;
            let dollars = (userBalance / 4000).toFixed(2);
            document.getElementById('dollar').innerText = dollars;
        }

        function watchAd() {
            const statusDiv = document.getElementById('status');
            
            let adLogs = JSON.parse(localStorage.getItem('ad_logs') || '[]');
            const now = Date.now();
            adLogs = adLogs.filter(time => now - time < 3600000);
            
            if (adLogs.length >= 15) {
                statusDiv.style.color = "#ffcc00";
                statusDiv.innerText = "⚠️ وصلت للحد الأقصى مؤقتاً.";
                return;
            }

            // إضافة النقاط فوراً لضمان تجربة مستخدم سريعة
            userBalance += 400;
            localStorage.setItem('user_balance', userBalance);
            adLogs.push(now);
            localStorage.setItem('ad_logs', JSON.stringify(adLogs));
            updateUI();
            
            statusDiv.style.color = "#00ffcc";
            statusDiv.innerText = "🎉 مبروك! تمت إضافة 400 عملة لرصيدك.";
        }

        function convertToDollar() {
            alert("تم تحديث حساب الأرباح بنجاح!");
        }
    </script>
</body>
</html>
